<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constructor de preguntas — Preguntas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1D2A44" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css?v=9" />
</head>
<body>

  <header class="topbar">
    <a href="menu.html" class="topbar__settings" title="Menú principal">🏠</a>
    <span class="topbar__mark">●</span>
    <h1 class="topbar__title">Constructor de preguntas</h1>
  </header>

  <main class="layout" style="grid-template-columns: 1fr; max-width: 640px;">
    <section class="panel">
      <a href="menu.html" class="back-link">← Volver al menú</a>

      <div class="field">
        <label for="qSubject">Materia (opcional)</label>
        <input type="text" id="qSubject" placeholder="Ej: Mate, Lenguaje, Historia..." />
      </div>

      <div class="field">
        <label for="qText">Enunciado de la pregunta</label>
        <textarea id="qText" placeholder="Ej: Elija la alternativa que conecte adecuadamente las ideas del texto..."></textarea>
      </div>

      <div class="field">
        <label for="qImage">Imagen (opcional)</label>
        <input type="file" id="qImage" accept="image/*" />
        <div id="qImageStatus" class="pdf-status"></div>
        <img id="qImagePreview" class="quiz-image" style="display:none; margin-top:0.6rem; max-height:220px;" alt="Vista previa de la imagen" />
        <button type="button" id="qImageRemove" class="btn btn--secondary" style="display:none;">Quitar imagen</button>
      </div>

      <div class="field">
        <label>Alternativas (marca la correcta)</label>
        <div id="optionsContainer"></div>
        <button type="button" id="addOptionBtn" class="btn btn--secondary">+ Agregar alternativa</button>
      </div>

      <div class="field">
        <label for="qExplanation">Explicación (opcional — se muestra apenas responda, sin usar la IA)</label>
        <textarea id="qExplanation" placeholder="Ej: La primera elipsis indica una consecuencia ('por eso')..."></textarea>
      </div>

      <button id="addQuestionBtn" class="btn btn--primary">Guardar pregunta en el banco</button>
      <div id="formStatus" class="pdf-status"></div>
    </section>

    <section class="panel">
      <h2 class="panel__label">Banco de preguntas guardadas (<span id="bankCount">0</span>)</h2>
      <p style="font-size:0.82rem; color:#9BA9C9; margin-top:-0.4rem;">
        Quedan guardadas para siempre (aunque reinicies el quiz). Marca las que quieras mandar ahora — se envían en orden aleatorio.
      </p>
      <div id="bankList"></div>
      <button id="sendSelectedBtn" class="btn btn--primary" disabled>Enviar seleccionadas al panel del papá (aleatorio)</button>
    </section>
  </main>

  <script>
    const BANK_KEY = "manual_question_bank";

    const el = {
      qSubject: document.getElementById("qSubject"),
      qText: document.getElementById("qText"),
      qImage: document.getElementById("qImage"),
      qImageStatus: document.getElementById("qImageStatus"),
      qImagePreview: document.getElementById("qImagePreview"),
      qImageRemove: document.getElementById("qImageRemove"),
      optionsContainer: document.getElementById("optionsContainer"),
      addOptionBtn: document.getElementById("addOptionBtn"),
      qExplanation: document.getElementById("qExplanation"),
      addQuestionBtn: document.getElementById("addQuestionBtn"),
      formStatus: document.getElementById("formStatus"),
      bankCount: document.getElementById("bankCount"),
      bankList: document.getElementById("bankList"),
      sendSelectedBtn: document.getElementById("sendSelectedBtn"),
    };

    let uploadedImage = null; // dataURL de la imagen ya comprimida
    let bank = [];            // banco permanente: [{ id, question, options, correctIndex, image, explanation, subject, selected }]

    // --- Cargar / guardar el banco permanente ---
    function loadBank() {
      try {
        bank = JSON.parse(localStorage.getItem(BANK_KEY) || "[]");
      } catch (e) {
        bank = [];
      }
    }

    function saveBank() {
      localStorage.setItem(BANK_KEY, JSON.stringify(bank));
    }

    // --- Alternativas dinámicas (arranca con 4, mínimo 2, máximo 6) ---
    function addOptionRow(checked = false) {
      const rows = el.optionsContainer.querySelectorAll(".option-row").length;
      if (rows >= 6) return;

      const row = document.createElement("div");
      row.className = "option-row";
      row.innerHTML = `
        <input type="radio" name="correctOption" ${checked ? "checked" : ""} title="Marcar como correcta" />
        <input type="text" placeholder="Texto de la alternativa" />
        <button type="button" class="option-row__remove" title="Quitar">✕</button>
      `;
      row.querySelector(".option-row__remove").addEventListener("click", () => {
        if (el.optionsContainer.querySelectorAll(".option-row").length <= 2) return;
        row.remove();
      });
      el.optionsContainer.appendChild(row);
    }

    function resetOptionRows() {
      el.optionsContainer.innerHTML = "";
      addOptionRow(true);
      addOptionRow(false);
      addOptionRow(false);
      addOptionRow(false);
    }

    el.addOptionBtn.addEventListener("click", () => addOptionRow(false));
    resetOptionRows();

    // --- Imagen: se comprime igual que en app.js, para no pesar demasiado ---
    function compressImage(file, maxWidth = 900, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    el.qImage.addEventListener("change", async () => {
      const file = el.qImage.files[0];
      if (!file) return;
      el.qImageStatus.textContent = "Cargando imagen…";
      try {
        uploadedImage = await compressImage(file);
        el.qImageStatus.textContent = `Imagen cargada: "${file.name}".`;
        el.qImagePreview.src = uploadedImage;
        el.qImagePreview.style.display = "block";
        el.qImageRemove.style.display = "block";
      } catch (err) {
        el.qImageStatus.textContent = "No se pudo cargar la imagen.";
        uploadedImage = null;
      }
    });

    el.qImageRemove.addEventListener("click", () => {
      uploadedImage = null;
      el.qImage.value = "";
      el.qImageStatus.textContent = "";
      el.qImagePreview.src = "";
      el.qImagePreview.style.display = "none";
      el.qImageRemove.style.display = "none";
    });

    // --- Guardar la pregunta armada en el banco permanente ---
    el.addQuestionBtn.addEventListener("click", () => {
      const question = el.qText.value.trim();
      if (!question) {
        el.formStatus.textContent = "Escribe el enunciado de la pregunta.";
        return;
      }

      const rows = [...el.optionsContainer.querySelectorAll(".option-row")];
      const options = rows.map((r) => r.querySelector('input[type="text"]').value.trim());
      const correctRow = rows.findIndex((r) => r.querySelector('input[type="radio"]').checked);

      if (options.some((o) => !o)) {
        el.formStatus.textContent = "Completa el texto de todas las alternativas (o quita las que no uses).";
        return;
      }
      if (correctRow === -1) {
        el.formStatus.textContent = "Marca cuál alternativa es la correcta.";
        return;
      }

      bank.push({
        id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
        question,
        options,
        correctIndex: correctRow,
        image: uploadedImage || null,
        explanation: el.qExplanation.value.trim() || null,
        subject: el.qSubject.value.trim() || null,
        selected: true, // recién creada: queda marcada para el próximo envío
      });
      saveBank();

      // Reset del formulario para la siguiente pregunta (la materia se mantiene, suele repetirse)
      el.qText.value = "";
      el.qExplanation.value = "";
      el.qImage.value = "";
      el.qImageStatus.textContent = "";
      el.qImagePreview.src = "";
      el.qImagePreview.style.display = "none";
      el.qImageRemove.style.display = "none";
      uploadedImage = null;
      resetOptionRows();
      el.formStatus.textContent = "Pregunta guardada en el banco.";

      renderBank();
    });

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function renderBank() {
      el.bankCount.textContent = bank.length;
      const selectedCount = bank.filter((q) => q.selected).length;
      el.sendSelectedBtn.disabled = selectedCount === 0;
      el.sendSelectedBtn.textContent =
        selectedCount > 0
          ? `Enviar ${selectedCount} seleccionada(s) al panel del papá (aleatorio)`
          : "Enviar seleccionadas al panel del papá (aleatorio)";

      el.bankList.innerHTML = bank.length
        ? bank
            .map(
              (q) => `
          <div class="bank-card">
            <input type="checkbox" data-id="${q.id}" ${q.selected ? "checked" : ""} />
            <div class="bank-card__body">
              ${q.subject ? `<span class="question-meta__subject">${escapeHtml(q.subject)}</span> ` : ""}
              ${escapeHtml(q.question)}
              <div class="bank-card__meta">
                Correcta: ${escapeHtml(q.options[q.correctIndex])}
                ${q.image ? " · 🖼️ con imagen" : ""}
                ${q.explanation ? " · 📝 con explicación" : ""}
              </div>
            </div>
            <button type="button" class="bank-card__delete" data-delete="${q.id}">Borrar</button>
          </div>
        `
            )
            .join("")
        : `<p style="color:#9BA9C9; font-size:0.85rem;">Todavía no guardaste ninguna pregunta.</p>`;

      el.bankList.querySelectorAll("input[type=checkbox]").forEach((cb) => {
        cb.addEventListener("change", () => {
          const q = bank.find((b) => b.id === cb.dataset.id);
          if (q) {
            q.selected = cb.checked;
            saveBank();
            renderBank();
          }
        });
      });

      el.bankList.querySelectorAll("[data-delete]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (!confirm("¿Borrar esta pregunta del banco para siempre?")) return;
          bank = bank.filter((b) => b.id !== btn.dataset.delete);
          saveBank();
          renderBank();
        });
      });
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // --- Enviar las seleccionadas (mezcladas) al lote del papá, sin borrarlas del banco ---
    el.sendSelectedBtn.addEventListener("click", () => {
      const selected = bank.filter((q) => q.selected);
      if (selected.length === 0) return;

      const toSend = shuffle(selected).map(({ id, selected, ...q }) => q);

      let state = { questionBank: [], currentIndex: -1, score: { correct: 0, total: 0 } };
      try {
        const saved = JSON.parse(localStorage.getItem("quiz_state") || "null");
        if (saved) state = saved;
      } catch (e) {}

      state.questionBank = (state.questionBank || []).concat(toSend);
      localStorage.setItem("quiz_state", JSON.stringify(state));

      // Se desmarcan (quedan guardadas en el banco, pero hay que elegirlas de nuevo la próxima vez)
      bank.forEach((q) => (q.selected = false));
      saveBank();

      window.location.href = "index.html";
    });

    loadBank();
    renderBank();
  </script>
</body>
</html>
