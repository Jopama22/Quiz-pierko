<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Constructor de preguntas — Preguntas para ti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<meta name="theme-color" content="#1D2A44" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="stylesheet" href="style.css?v=8" />
</head>
<body>

  <header class="topbar">
    <a href="menu.html" class="topbar__settings" title="Menú principal">🏠</a>
    <span class="topbar__mark">●</span>
    <h1 class="topbar__title">Constructor de preguntas</h1>
  </header>

  <main class="layout" style="grid-template-columns: 1fr; max-width: 640px;">
    <section class="panel">
      <a href="menu.html" class="back-link">← Volver al menú</a>

      <div class="field">
        <label for="qText">Enunciado de la pregunta</label>
        <textarea id="qText" placeholder="Ej: Elija la alternativa que conecte adecuadamente las ideas del texto..."></textarea>
      </div>

      <div class="field">
        <label for="qImage">Imagen (opcional)</label>
        <input type="file" id="qImage" accept="image/*" />
        <div id="qImageStatus" class="pdf-status"></div>
      </div>

      <div class="field">
        <label>Alternativas (marca la correcta)</label>
        <div id="optionsContainer"></div>
        <button type="button" id="addOptionBtn" class="btn btn--secondary">+ Agregar alternativa</button>
      </div>

      <div class="field">
        <label for="qExplanation">Explicación (opcional — se muestra apenas responda, sin usar la IA)</label>
        <textarea id="qExplanation" placeholder="Ej: La primera elipsis indica una consecuencia ('por eso')..."></textarea>
      </div>

      <button id="addQuestionBtn" class="btn btn--primary">Agregar pregunta a la lista</button>
      <div id="formStatus" class="pdf-status"></div>
    </section>

    <section class="panel">
      <h2 class="panel__label">Preguntas listas para enviar (<span id="pendingCount">0</span>)</h2>
      <div id="pendingList"></div>
      <button id="saveAllBtn" class="btn btn--primary" disabled>Guardar en el lote y volver al panel del papá</button>
    </section>
  </main>

  <script>
    const el = {
      qText: document.getElementById("qText"),
      qImage: document.getElementById("qImage"),
      qImageStatus: document.getElementById("qImageStatus"),
      optionsContainer: document.getElementById("optionsContainer"),
      addOptionBtn: document.getElementById("addOptionBtn"),
      qExplanation: document.getElementById("qExplanation"),
      addQuestionBtn: document.getElementById("addQuestionBtn"),
      formStatus: document.getElementById("formStatus"),
      pendingCount: document.getElementById("pendingCount"),
      pendingList: document.getElementById("pendingList"),
      saveAllBtn: document.getElementById("saveAllBtn"),
    };

    let uploadedImage = null; // dataURL de la imagen ya comprimida
    let pendingQuestions = []; // preguntas armadas en esta sesión, listas para guardar

    // --- Alternativas dinámicas (arranca con 4, mínimo 2, máximo 6) ---
    function addOptionRow(checked = false) {
      const rows = el.optionsContainer.querySelectorAll(".option-row").length;
      if (rows >= 6) return;

      const row = document.createElement("div");
      row.className = "option-row";
      row.innerHTML = `
        <input type="radio" name="correctOption" ${checked ? "checked" : ""} title="Marcar como correcta" />
        <input type="text" placeholder="Texto de la alternativa" />
        <button type="button" class="option-row__remove" title="Quitar">✕</button>
      `;
      row.querySelector(".option-row__remove").addEventListener("click", () => {
        if (el.optionsContainer.querySelectorAll(".option-row").length <= 2) return;
        row.remove();
      });
      el.optionsContainer.appendChild(row);
    }

    el.addOptionBtn.addEventListener("click", () => addOptionRow(false));
    addOptionRow(true);
    addOptionRow(false);
    addOptionRow(false);
    addOptionRow(false);

    // --- Imagen: se comprime igual que en app.js, para no pesar demasiado ---
    function compressImage(file, maxWidth = 900, quality = 0.7) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();
        reader.onload = (e) => {
          img.onload = () => {
            const scale = Math.min(1, maxWidth / img.width);
            const canvas = document.createElement("canvas");
            canvas.width = img.width * scale;
            canvas.height = img.height * scale;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    el.qImage.addEventListener("change", async () => {
      const file = el.qImage.files[0];
      if (!file) return;
      el.qImageStatus.textContent = "Cargando imagen…";
      try {
        uploadedImage = await compressImage(file);
        el.qImageStatus.textContent = `Imagen cargada: "${file.name}".`;
      } catch (err) {
        el.qImageStatus.textContent = "No se pudo cargar la imagen.";
        uploadedImage = null;
      }
    });

    // --- Agregar la pregunta armada a la lista pendiente ---
    el.addQuestionBtn.addEventListener("click", () => {
      const question = el.qText.value.trim();
      if (!question) {
        el.formStatus.textContent = "Escribe el enunciado de la pregunta.";
        return;
      }

      const rows = [...el.optionsContainer.querySelectorAll(".option-row")];
      const options = rows.map((r) => r.querySelector('input[type="text"]').value.trim());
      const correctRow = rows.findIndex((r) => r.querySelector('input[type="radio"]').checked);

      if (options.some((o) => !o)) {
        el.formStatus.textContent = "Completa el texto de todas las alternativas (o quita las que no uses).";
        return;
      }
      if (correctRow === -1) {
        el.formStatus.textContent = "Marca cuál alternativa es la correcta.";
        return;
      }

      const explanation = el.qExplanation.value.trim();

      pendingQuestions.push({
        question,
        options,
        correctIndex: correctRow,
        image: uploadedImage || null,
        explanation: explanation || null,
      });

      // Reset del formulario para la siguiente pregunta
      el.qText.value = "";
      el.qExplanation.value = "";
      el.qImage.value = "";
      el.qImageStatus.textContent = "";
      uploadedImage = null;
      el.optionsContainer.innerHTML = "";
      addOptionRow(true);
      addOptionRow(false);
      addOptionRow(false);
      addOptionRow(false);
      el.formStatus.textContent = "Pregunta agregada a la lista de abajo.";

      renderPendingList();
    });

    function renderPendingList() {
      el.pendingCount.textContent = pendingQuestions.length;
      el.saveAllBtn.disabled = pendingQuestions.length === 0;

      el.pendingList.innerHTML = pendingQuestions
        .map((q, i) => `
          <div class="question-preview-card">
            <div class="question-preview-card__top">
              <div>
                <strong>${i + 1}.</strong> ${escapeHtml(q.question)}
                <div style="color:#9BA9C9; margin-top:0.3rem;">
                  Correcta: ${escapeHtml(q.options[q.correctIndex])}
                  ${q.image ? " · 🖼️ con imagen" : ""}
                  ${q.explanation ? " · 📝 con explicación" : ""}
                </div>
              </div>
              <button type="button" class="question-preview-card__remove" data-index="${i}">Quitar</button>
            </div>
          </div>
        `)
        .join("") || `<p style="color:#9BA9C9; font-size:0.85rem;">Todavía no agregaste ninguna pregunta.</p>`;

      el.pendingList.querySelectorAll(".question-preview-card__remove").forEach((btn) => {
        btn.addEventListener("click", () => {
          pendingQuestions.splice(Number(btn.dataset.index), 1);
          renderPendingList();
        });
      });
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    // --- Guardar todo en el mismo localStorage que usa index.html (quiz_state) ---
    el.saveAllBtn.addEventListener("click", () => {
      if (pendingQuestions.length === 0) return;

      let state = { questionBank: [], currentIndex: -1, score: { correct: 0, total: 0 } };
      try {
        const saved = JSON.parse(localStorage.getItem("quiz_state") || "null");
        if (saved) state = saved;
      } catch (e) {}

      state.questionBank = (state.questionBank || []).concat(pendingQuestions);
      localStorage.setItem("quiz_state", JSON.stringify(state));

      window.location.href = "index.html";
    });

    renderPendingList();
  </script>
</body>
</html>
